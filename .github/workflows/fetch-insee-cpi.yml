name: Update INSEE CPI Gist

# Triggered externally once a day at 05:40 UTC by the Cloudflare Worker
# `mon-patrimoine-dispatcher` (worker/ in this repo) via workflow_dispatch.
# GitHub's own `schedule:` was removed: it is best-effort, only read from the
# default branch, and auto-disabled after 60 days without repository activity.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch CPI and update Gist if changed
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 scripts/fetch_insee_cpi.py
