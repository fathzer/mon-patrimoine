name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - first
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp web/privacy.html _site/privacy.html
          cp web/terms.html _site/terms.html
          cp web/favicon.svg _site/favicon.svg
          cp web/manifest.json _site/manifest.json
          cp -r web/css _site/css
          cp -r web/src _site/src
          sed "s/BUILD_HASH/${{ github.sha }}/g" web/sw.template.js > _site/sw.js
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
